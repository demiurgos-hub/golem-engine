// Golem Inspector protocol, version 1.
//
// This file is the human-readable specification. The Go codec in this package
// and the TypeScript codec in golem-inspector/src/protocol are hand-written
// against it; golden fixtures under testdata/ keep them in agreement.
//
// Every WebSocket frame on /ws/agent and /ws/client is one binary Envelope.
// Entity payloads are the game's own generated protobuf messages (XState and
// XDelta from entities.proto), carried as opaque bytes and decoded generically
// with the Schema descriptor the agent sends at registration.
syntax = "proto3";
package golem.inspector.v1;

message Envelope {
  uint32 version = 1; // must equal 1
  oneof body {
    // agent -> hub
    Register register = 10;
    ObserveStatus observe_status = 11;
    SnapshotBegin snapshot_begin = 12; // also hub -> browser
    SnapshotChunk snapshot_chunk = 13; // also hub -> browser
    SnapshotEnd snapshot_end = 14;     // also hub -> browser
    Batch batch = 15;                  // also hub -> browser
    Ping ping = 16;                    // agent/browser -> hub
    Pong pong = 17;                    // hub -> agent/browser
    // hub -> agent
    ObserveStart observe_start = 20;
    ObserveStop observe_stop = 21;
    Error error = 22; // hub -> agent/browser
    // browser -> hub
    Subscribe subscribe = 30;
    Resync resync = 31;
    // hub -> browser
    TargetSchema target_schema = 40;
    WorldStatus world_status = 41;
    ResyncRequired resync_required = 42;
  }
}

message Register {
  string target_id = 1;
  map<string, string> labels = 2;
  uint64 epoch = 3;
  string engine_version = 4;
  Schema schema = 5;
  uint32 tick_rate = 6;
}

enum ObserveState {
  OBSERVE_IDLE = 0;
  OBSERVE_STARTING = 1;
  OBSERVE_READY = 2;
}

message ObserveStatus {
  ObserveState state = 1;
  uint64 entity_count = 2;
  uint64 epoch = 3;
}

// Snapshot and batch messages carry the target id only on hub -> browser frames.
// seq is contiguous per epoch on the agent link and per connection on the browser link.
message SnapshotBegin {
  string target_id = 1;
  uint64 epoch = 2;
  uint64 seq = 3;
  uint64 tick = 4;
  uint64 entity_count = 5;
}

message SnapshotChunk {
  string target_id = 1;
  uint64 epoch = 2;
  uint64 seq = 3;
  repeated EntityState entities = 4;
}

message SnapshotEnd {
  string target_id = 1;
  uint64 epoch = 2;
  uint64 seq = 3;
}

message Batch {
  string target_id = 1;
  uint64 epoch = 2;
  uint64 seq = 3;
  uint64 tick = 4;
  repeated EntityState spawns = 5;
  repeated EntityDelta deltas = 6;
  repeated Removal removals = 7;
}

// type_tag is always the entity's State oneof tag from EntityUpdate.
message EntityState {
  int64 id = 1;
  uint32 type_tag = 2;
  bytes state = 3; // game XState message
}

// mask is the accumulated replication dirty mask. Receivers replace every
// field whose bit is set; a set bit whose field is absent resets the field.
message EntityDelta {
  int64 id = 1;
  uint32 type_tag = 2;
  uint64 revision = 3;
  uint64 mask = 4;
  bytes delta = 5; // game XDelta message
}

message Removal {
  int64 id = 1;
  uint64 revision = 2;
}

message Ping { int64 client_time = 1; }
message Pong { int64 client_time = 1; }

message ObserveStart {}
message ObserveStop {}

message Error {
  string code = 1;
  string message = 2;
  string target_id = 3;
}

message Subscribe { string target_id = 1; }
message Resync { string target_id = 1; }

message TargetSchema {
  string target_id = 1;
  Schema schema = 2;
}

message WorldStatus {
  string target_id = 1;
  uint64 epoch = 2;
  uint64 entity_count = 3;
  bool ready = 4;
  bool agent_connected = 5;
  ObserveState observe_state = 6;
  uint64 tick = 7;
}

message ResyncRequired {
  string target_id = 1;
  uint64 epoch = 2;
  string reason = 3;
}

// ---- Schema descriptor (generated by golem-bake as InspectorSchema()) ----

message Schema {
  string fingerprint = 1;
  uint32 dimensions = 2;
  uint32 removed_tag = 3;
  repeated Entity entities = 4;
  repeated CustomType types = 5;
}

message Entity {
  string name = 1;
  uint32 state_tag = 2;
  uint32 delta_tag = 3;
  bool global = 4;
  repeated Field fields = 5;
  bool is_3d = 6;
}

enum FieldKind {
  KIND_SCALAR = 0;
  KIND_CUSTOM = 1;
  KIND_LIST = 2;
  KIND_MAP = 3;
}

// Field roles: "identity" (entity_id), "position" (pos_x/y/z), "revision", "variable".
// List elements are encoded one per wire-type-2 entry holding the bare scalar
// (or the custom message); map entries are {1: key, 2: value} messages. A
// zero-length entry in a delta means "collection cleared".
message Field {
  string name = 1;
  uint32 tag = 2;
  sint32 bit = 3; // dirty-mask bit, -1 when the field is not delta-tracked
  string sync = 4; // "tick", "once" or "" for implicit fields
  bool owner_only = 5;
  FieldKind kind = 6;
  string type = 7; // scalar name or custom type name (element type for collections)
  string key_type = 8; // map key scalar
  string role = 9;
}

message CustomType {
  string name = 1;
  repeated Field fields = 2;
}
